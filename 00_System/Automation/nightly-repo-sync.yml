name: nightly-repo-sync

on:
  schedule:
    # Runs automatically every night at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-repo-sync
  cancel-in-progress: false

jobs:
  sync:
    name: sync watched repos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Build TypeScript
        run: npm run build
      - name: Run Incremental Repo Sync & Ingest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node ./bin/sb.js sync-repos --ingest --vault ./vault-template

